<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Gestión de Deportes Universitarios</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background-color: #f4f4f9;
      }
      h1,
      h2 {
        color: #333;
      }
      .tarjeta-contenedor {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 40px;
      }
      .tarjeta {
        background: white;
        border-radius: 8px;
        padding: 20px;
        width: 250px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .tarjeta h3 {
        margin-top: 0;
        color: #007bff;
      }
      .estado {
        font-weight: bold;
        color: green;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }
      th {
        background-color: #007bff;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Sistema de Deportes Universitario</h1>

    <h2>Actividades Disponibles</h2>
    <div id="contenedor-actividades" class="tarjeta-contenedor">
      <p>Cargando actividades...</p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
